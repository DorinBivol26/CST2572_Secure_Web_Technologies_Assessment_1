<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b87">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>CareLocal</title>
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">CST2572 assessment</p>
      <h1>CareLocal</h1>
      <p>Offline-ready patient records and appointment management.</p>
    </div>
    <span id="connection-status" class="status">Checking connection...</span>
  </header>

  <main>
    <section id="setup-panel" class="card">
      <h2>Local data setup</h2>
      <p id="setup-message">Preparing the local database...</p>
      <button id="refresh-data" type="button">Import JSON data</button>
    </section>

    <section class="card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Role demonstration</p>
          <h2>Choose a workspace</h2>
        </div>
        <span id="record-count" class="muted"></span>
      </div>
      <nav class="role-tabs" aria-label="Workspace roles">
        <button class="role-tab active" data-role="patient">Patient</button>
        <button class="role-tab" data-role="admin">Admin</button>
        <button class="role-tab" data-role="doctor">Doctor</button>
      </nav>
      <div id="workspace"></div>
    </section>
  </main>

  <template id="patient-template">
    <div class="grid two-column">
      <div>
        <h3>Book an appointment</h3>
        <form id="appointment-form" class="stack">
          <label>Patient ID <input name="patientId" required value="p-001"></label>
          <label>Doctor ID <input name="doctorId" required value="d-001"></label>
          <label>Date and time <input name="scheduledAt" type="datetime-local" required></label>
          <button type="submit">Save appointment</button>
        </form>
      </div>
      <div>
        <h3>My medicines</h3>
        <div id="patient-medicines" class="list"></div>
      </div>
    </div>
    <h3>Appointments</h3>
    <div id="patient-appointments" class="list"></div>
  </template>

  <template id="admin-template">
    <h3>Manage patients</h3>
    <form id="patient-form" class="grid patient-form">
      <input type="hidden" name="id">
      <label>Name <input name="name" required maxlength="80"></label>
      <label>Address <input name="address" required maxlength="160"></label>
      <label>Telephone <input name="telephone" required pattern="[0-9 +()\-]{7,20}"></label>
      <label>Date of birth <input name="dateOfBirth" type="date" required></label>
      <label>NHS number <input name="nhsNumber" required pattern="[0-9]{10}"></label>
      <div class="form-actions"><button type="submit">Save patient</button><button id="clear-patient" type="button" class="secondary">Clear</button></div>
    </form>
    <p id="admin-message" class="message" aria-live="polite"></p>
    <div id="admin-patients" class="list"></div>
  </template>

  <template id="doctor-template">
    <h3>Doctor workspace</h3>
    <p class="muted">Choose a patient and doctor before adding medical records.</p>
    <div class="grid two-column form-spacing">
      <label>Patient <select id="doctor-patient" required></select></label>
      <label>Doctor <select id="doctor-select" required></select></label>
    </div>
    <p id="doctor-message" class="message" aria-live="polite"></p>
    <div class="grid two-column">
      <div>
        <h3>Add clinical history / note</h3>
        <form id="note-form" class="stack">
          <label>Clinical note <textarea id="note-text" required maxlength="500"></textarea></label>
          <button type="submit">Save medical note</button>
        </form>
      </div>
      <div>
        <h3>Add medicine / treatment</h3>
        <form id="prescription-form" class="stack">
          <label>Medicine <select id="medicine-options" required></select></label>
          <label>Treatment instructions <input id="medicine-instructions" required maxlength="200"></label>
          <button type="submit">Save prescription</button>
        </form>
      </div>
    </div>
    <h3>Patient medical history</h3>
    <div id="doctor-history" class="list"></div>
    <h3>Medical notes</h3>
    <div id="doctor-notes" class="list"></div>
    <h3>Prescriptions and treatments</h3>
    <div id="doctor-prescriptions" class="list"></div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
